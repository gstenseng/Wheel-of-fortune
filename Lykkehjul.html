<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spin the Wheel</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: url("background.png") no-repeat center center fixed;
  background-size: cover;
  color: white;
}

/* overlay */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  pointer-events: none;
}

/* LOGO */
.logo {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 420px;
  z-index: 1000;
}

/* LAYOUT */
.layout {
  display: flex;
  align-items: center;
  gap: 60px;
  position: relative;
  z-index: 2;
}

/* TEXT */
.left-text {
  text-align: center;
  text-rendering: geometricPrecision;
  -webkit-font-smoothing: antialiased;
}

.line1 { font-size: 40px; }
.line2 { font-size: 64px; }
.line3 { font-size: 58px; color: #ff0066; }

/* WHEEL */
.wheel-container {
  position: relative;
  width: 900px;
}

/* POINTER */
.pointer {
  width: 0;
  height: 0;
  border-left: 35px solid transparent;
  border-right: 35px solid transparent;
  border-top: 70px solid white;
  position: absolute;
  top: -25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

/* BUTTON */
button {
  margin-top: 30px;
  padding: 20px 40px;
  font-size: 24px;
  background: #ff0066;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  position: relative;
  z-index: 3;
}

/* ✅ QR BLOCK */
.qr-box {
  position: fixed;
  right: 30px;
  bottom: 30px;
  text-align: center;
  z-index: 1000;
}

.qr-text {
  margin-bottom: 10px;
  font-size: 20px;
  font-weight: bold;
  text-rendering: geometricPrecision;
  -webkit-font-smoothing: antialiased;
}

.qr-box img {
  width: 160px;
  border-radius: 10px;
  background: white;
  padding: 6px;
}

/* MOBILE */
@media (max-width: 900px) {

  .layout {
    flex-direction: column;
    gap: 20px;
    padding-top: 80px;
  }

  .logo {
    width: 180px;
  }

  .line1 { font-size: 24px; }
  .line2 { font-size: 36px; }
  .line3 { font-size: 32px; }

  .wheel-container {
    width: 340px;
  }

  .pointer {
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 35px solid white;
    top: -10px;
  }

  button {
    width: 70%;
  }

  .qr-box {
    right: 10px;
    bottom: 10px;
  }

  .qr-box img {
    width: 120px;
  }

  .qr-text {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<img src="logo.svg" class="logo">

<div class="layout">

  <div class="left-text">
    <div class="line1">Try our</div>
    <div class="line2">wheel of fortune</div>
    <div class="line3">win prizes</div>
  </div>

  <div>
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel"></canvas>
    </div>

    <div style="text-align:center;">
      <button onclick="spin()">SPIN</button>
    </div>
  </div>

</div>

<!-- ✅ QR SECTION -->
<div class="qr-box">
  <div class="qr-text">Win an AI workshop</div>
  <img src="QRCode.jpeg" alt="QR code">
</div>

<script>

const options = [
  "Tote bag",
  "Running belt",
  "Glass bottle",
  "Try again",
  "Running belt",
  "Tote bag",
  "Shoe shine",
  "Running belt",
  "One more try",
  "Tote bag",
  "Glass bottle",
  "Shoe shine"
];

let currentAngle = 0;
let isSpinning = false;

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

function resizeAndDraw() {

  const size = canvas.parentElement.offsetWidth;

  canvas.width = size;
  canvas.height = size;

  const center = size / 2;
  const radius = size / 2;
  const arc = 2 * Math.PI / options.length;

  ctx.clearRect(0,0,size,size);

  options.forEach((opt, i) => {

    const start = i * arc;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, start, start + arc);
    ctx.fillStyle = ["#5a82a6","#7b5c99","#5aa6b8","#b34a7a"][i % 4];
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.stroke();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(start + arc / 2);

    ctx.fillStyle = "white";
    ctx.font = `bold ${size * 0.032}px Arial`;
    ctx.textAlign = "center";

    ctx.fillText(opt, radius - (size * 0.18), 0);

    ctx.restore();
  });
}

function spin() {

  if (isSpinning) return;

  isSpinning = true;

  canvas.style.transition = "none";
  canvas.style.transform = `rotate(${currentAngle}deg)`;
  canvas.offsetHeight;

  const spin = Math.random() * 360 + 720;
  currentAngle += spin;

  canvas.style.transition = "transform 4s cubic-bezier(0.33, 1, 0.68, 1)";
  canvas.style.transform = `rotate(${currentAngle}deg)`;

  setTimeout(() => {
    isSpinning = false;
  }, 4000);
}

resizeAndDraw();
window.addEventListener("resize", resizeAndDraw);

</script>

</body>
</html>
