<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spin the Wheel</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;

    background: url("background.png") no-repeat center center fixed;
    background-size: cover;
    color: white;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 0;
  }

  /* LOGO */
  .logo {
    position: fixed;
    top: 30px;
    left: 30px;
    width: 560px;
    z-index: 1000;
  }

  .layout {
    display: flex;
    align-items: center;
    gap: 80px;
    z-index: 1;
  }

  /* TEXT */
  .left-text {
    max-width: 500px;
    text-align: center;
  }

  .line1 {
    font-size: 40px;
  }

  .line2 {
    font-size: 64px;
  }

  .line3 {
    font-size: 58px;
    color: #ff0066;
  }

  /* WHEEL */
  .wheel-container {
    position: relative;
    width: 900px;
  }

  canvas {
    border-radius: 50%;
    background: white;
  }

  .pointer {
    width: 0;
    height: 0;
    border-left: 35px solid transparent;
    border-right: 35px solid transparent;
    border-top: 70px solid white;

    position: absolute;
    top: -25px;
    left: 50%;
    transform: translateX(-50%);
  }

  button {
    margin-top: 30px;
    padding: 20px 40px;
    font-size: 22px;
    background: #ff0066;
    color: white;
    border: none;
    border-radius: 8px;
  }

  /* ✅ MOBILE VERSION */
  @media (max-width: 900px) {

    .layout {
      flex-direction: column; /* stack */
      gap: 20px;
    }

    .logo {
      width: 180px;  /* smaller logo */
      top: 10px;
      left: 10px;
    }

    .line1 {
      font-size: 26px;
    }

    .line2 {
      font-size: 36px;
    }

    .line3 {
      font-size: 32px;
    }

    .wheel-container {
      width: 340px;
    }

    canvas {
      width: 340px;
      height: 340px;
    }

    .pointer {
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 35px solid white;
      top: -10px;
    }

    button {
      width: 80%;
      font-size: 20px;
    }
  }
</style>
</head>

<body>

<img src="logo.svg" class="logo">

<div class="layout">

  <div class="left-text">
    <div class="line1">Try our</div>
    <div class="line2">wheel of fortune</div>
    <div class="line3">win prizes</div>
  </div>

  <div>
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="900" height="900"></canvas>
    </div>

    <div style="text-align:center;">
      <button onclick="spin()">SPIN</button>
    </div>
  </div>

</div>

<script>
// same wheel JS (unchanged)
const options = [
  "Shopping bag","Try again","Running belt",
  "Shopping bag","Glass jar","Almost there – try again",
  "Shopping bag","Running belt","One more try",
  "Shopping bag","Glass jar","Running belt",
  "Shopping bag"
];

let currentAngle = 0;
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

function drawWheel() {
  const size = canvas.width;
  const center = size / 2;
  const radius = size / 2;
  const arc = 2 * Math.PI / options.length;

  options.forEach((opt, i) => {
    const start = i * arc;
    const end = start + arc;

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, start, end);
    ctx.fillStyle = i % 2 ? "#5a82a6" : "#7b5c99";
    ctx.fill();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(start + arc / 2);
    ctx.fillStyle = "white";
    ctx.font = "bold 16px Arial";
    ctx.fillText(opt, radius - 100, 0);
    ctx.restore();
  });
}

function spin() {
  const spin = Math.random() * 360 + 720;
  currentAngle += spin;
  canvas.style.transition = "transform 4s ease-out";
  canvas.style.transform = `rotate(${currentAngle}deg)`;
}

drawWheel();
</script>

</body>
</html>
