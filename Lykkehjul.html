<script>

const options = [
  "Tote bag",
  "Running belt",
  "Glass bottle",
  "Try again",
  "Running belt",
  "Tote bag",
  "Shoe shine",
  "Running belt",
  "One more try",
  "Tote bag",
  "Glass bottle",
  "Shoe shine"
];

const baseColors = [
  ["#5a82a6", "#3e5f7d"],
  ["#7b5c99", "#5a4373"],
  ["#5aa6b8", "#3d7480"],
  ["#b34a7a", "#7f3355"]
];

let currentAngle = 0;
let isSpinning = false;

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

function resizeAndDraw() {

  const size = canvas.parentElement.offsetWidth;

  canvas.width = size;
  canvas.height = size;

  const center = size / 2;
  const radius = size / 2;
  const arc = 2 * Math.PI / options.length;

  ctx.clearRect(0,0,size,size);

  options.forEach((opt, i) => {
    const start = i * arc;
    const end = start + arc;

    const colorSet = baseColors[i % 4];

    const grad = ctx.createLinearGradient(0, 0, 0, size);
    grad.addColorStop(0, colorSet[0]);
    grad.addColorStop(1, colorSet[1]);

    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, start, end);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.stroke();

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(start + arc / 2);

    ctx.fillStyle = "white";
    ctx.font = `bold ${size * 0.032}px Arial`;
    ctx.textAlign = "center";

    ctx.fillText(opt, radius - (size * 0.18), 0);

    ctx.restore();
  });
}

window.addEventListener("resize", resizeAndDraw);

function spin() {

  if (isSpinning) return;

  isSpinning = true;

  canvas.style.transition = "none";
  canvas.style.transform = `rotate(${currentAngle}deg)`;

  canvas.offsetHeight;

  const spin = Math.random() * 360 + 720;
  currentAngle += spin;

  canvas.style.transition = "transform 4s cubic-bezier(0.33, 1, 0.68, 1)";
  canvas.style.transform = `rotate(${currentAngle}deg)`;

  setTimeout(() => {
    isSpinning = false;
  }, 4000);
}

resizeAndDraw();

</script>
``
